[package]
name = "deecodex-gui"
version = "4.4.7"
edition = "2021"
description = "deecodex Desktop GUI"

[lib]
name = "deecodex_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
arboard = "3"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml_edit = "0.22"
deecodex = { path = ".." }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "stream", "system-proxy", "socks"] }
futures-util = "0.3"
dashmap = "6"
anyhow = "1"
deecodex-plugin-host = { path = "../deecodex-plugins" }
rfd = "0.15"
zip = "2"
base64 = "0.22"
minisign-verify = "0.2.5"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKSnapshotConfiguration", "block2"] }
block2 = "0.6"

[dev-dependencies]
